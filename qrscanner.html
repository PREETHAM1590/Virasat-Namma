<style>

<body class="bg-background text-on-surface antialiased overflow-hidden font-body-md h-screen w-screen selection:bg-primary-container selection:text-on-primary-container">
<!-- SVG Mask Definition for the blurred overlay cutout -->
<svg aria-hidden="true" class="absolute w-0 h-0">
<defs>
<mask height="100%" id="viewfinder-mask" width="100%" x="0" y="0">
<!-- White area represents what WILL be blurred/overlayed -->
<rect fill="white" height="100%" width="100%" x="0" y="0"></rect>
<!-- Black area is the cutout hole that remains clear -->
<rect fill="black" height="280" rx="32" transform="translate(-140, -140)" width="280" x="50%" y="50%"></rect>
</mask>
</defs>
</svg>
<!-- Main AR Container -->
<main class="relative w-full h-full bg-inverse-surface">
<!-- Clear Camera Background Layer (The Nature Plate) -->
<img alt="" aria-hidden="true" class="absolute inset-0 w-full h-full object-cover z-0" data-alt="A lush, dense ancient forest scene seen from a first-person perspective, acting as a background plate. The lighting is soft, dappled sunlight filtering through thick green canopies. The mood is mysterious and timeless, fitting a nature-heritage theme. Deep forest greens and soft light browns dominate the palette." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBLQF8F-2bBg9nCDsmEQhRaa7A77QJ3alGCULLABYeieKg4tiy44369xQUz623NOMX062FD_1N81LP7uUIOBTZX0CgYqtgiR7axKaR15uc4ovxdyvewKaqP_bSJZb8FXL2X5dA3pNKszQ62XA93qNjKu2YROjXx4xPklpOohkibAf5Iv6TdjMnzkDQSn6dAMjSyt-9Bcl3abv2KWqbN1ez2Co7mz2xD09cOsYtt1y0e3VGu0EUdYOnB_nFr4BX7PPNDVy6mCm9TZG0"/>
<!-- Blurred Overlay with Cutout -->
<div class="absolute inset-0 z-10 backdrop-blur-xl bg-inverse-surface/40 pointer-events-none" style="mask-image: url(#viewfinder-mask); -webkit-mask-image: url(#viewfinder-mask);"></div>
<!-- Viewfinder Reticle / Frame -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[280px] h-[280px] z-20 pointer-events-none">
<!-- Top Left Bracket -->
<div class="absolute top-0 left-0 w-12 h-12 border-t-4 border-l-4 border-primary-fixed-dim rounded-tl-[2rem] shadow-[inset_4px_4px_8px_rgba(183,210,63,0.3)]"></div>
<!-- Top Right Bracket -->
<div class="absolute top-0 right-0 w-12 h-12 border-t-4 border-r-4 border-primary-fixed-dim rounded-tr-[2rem] shadow-[inset_-4px_4px_8px_rgba(183,210,63,0.3)]"></div>
<!-- Bottom Left Bracket -->
<div class="absolute bottom-0 left-0 w-12 h-12 border-b-4 border-l-4 border-primary-fixed-dim rounded-bl-[2rem] shadow-[inset_4px_-4px_8px_rgba(183,210,63,0.3)]"></div>
<!-- Bottom Right Bracket -->
<div class="absolute bottom-0 right-0 w-12 h-12 border-b-4 border-r-4 border-primary-fixed-dim rounded-br-[2rem] shadow-[inset_-4px_-4px_8px_rgba(183,210,63,0.3)]"></div>
<!-- Scanning Line Animation Simulation (Static for rules, but styled) -->
<div class="absolute top-1/2 left-4 right-4 h-0.5 bg-primary-fixed-dim/80 shadow-[0_0_8px_2px_rgba(183,210,63,0.5)] rounded-full -translate-y-1/2"></div>
</div>
<!-- TopAppBar Shared Component Anchor -->
<header class="absolute top-0 left-0 z-30 bg-transparent w-full px-container-padding pt-4">
<div class="flex justify-between items-center w-full max-w-7xl mx-auto">
<button aria-label="Back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest/80 backdrop-blur-md text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity transition-transform duration-300 active:scale-95 shadow-sm">
<span class="material-symbols-outlined" data-icon="eco">eco</span>
</button>
<h1 class="font-headline-lg text-headline-lg text-surface-container-lowest tracking-tight drop-shadow-md">
                    Virasat
                </h1>
<button aria-label="Search" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest/80 backdrop-blur-md text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity transition-transform duration-300 active:scale-95 shadow-sm">
<span class="material-symbols-outlined" data-icon="search">search</span>
</button>
</div>
</header>
<!-- Floating Bottom Pill Container -->
<div class="absolute bottom-16 left-1/2 -translate-x-1/2 z-40 w-[calc(100%-48px)] max-w-sm">
<div class="bg-surface-container-lowest rounded-full px-6 py-4 flex items-center justify-center gap-4 shadow-[0_8px_32px_rgba(26,28,25,0.12)] border border-surface-container-high relative overflow-hidden group">
<!-- Neumorphic inner soft light -->
<div class="absolute inset-0 rounded-full bg-gradient-to-br from-white/60 to-transparent pointer-events-none"></div>
<!-- Icon -->
<div class="w-10 h-10 rounded-full bg-primary-fixed-dim/20 flex items-center justify-center text-primary-fixed-dim relative z-10">
<span class="material-symbols-outlined" data-icon="qr_code_scanner" data-weight="fill" style="font-variation-settings: 'FILL' 1;">qr_code_scanner</span>
</div>
<!-- Text -->
<span class="font-label-md text-label-md text-on-surface relative z-10">
                    Scan QR to unlock history
                </span>
</div>
</div>
</main>
