<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Heritage Site Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            maroon: {
              700: '#7B110F',
              800: '#5C0D0B',
            },
            brown: {
              50: '#FAF6F4',
              100: '#F5ECE8',
              800: '#522E2D',
              900: '#3A201F',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    /* Font weight utilities for Noto Serif */
    .font-serif-bold { font-family: 'Noto Serif', serif; font-weight: 700; }
    .font-serif-semibold { font-family: 'Noto Serif', serif; font-weight: 600; }
    
    /* Ensure body takes full height without scrolling if possible, matching app feel */
    html, body {
      height: 100%;
      overflow: hidden;
      background-color: #FAFAFA;
    }
    
    /* Smooth shadow for the bottom card */
    .card-shadow {
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.05);
    }
  </style>
</head>
<body class="font-sans text-gray-800 flex flex-col relative h-full">
<!-- BEGIN: Hero Image Section -->
<!-- Top section containing the full-bleed image and navigation overlays -->
<header class="relative flex-shrink-0 h-[60%] w-full overflow-hidden" data-purpose="hero-section">
<!-- Main Hero Image -->
<img alt="Virupaksha Temple" class="absolute inset-0 w-full h-full object-cover object-top" src="https://lh3.googleusercontent.com/aida/ADBb0uiAAwK7EHmP6TQKvA_ohe-Rv2hYDTQM0AYjJic2hGpM4NIYO8y8FOObIgkebm82uY8AURpoFqWbQgvfSU7uFetD5fKOU9fnMW4qByCrfkGdUHNL52_bHaYb-o1jJJyPLljuzH1RMPOWoVoD719uLdF037l8rp1I_3Ot4-g00EyGlLT506sWV9um9u9_VYc3mc6OxXd3KAPcnJPC6bZxzFV_1eve4yIOil6Gl4YsgponhN_YXTBhBMgcwuU"/>
<!-- Top Navigation Controls -->
<div class="absolute top-0 left-0 right-0 p-6 flex justify-between items-start z-10 safe-area-pt">
<!-- Back Button -->
<button aria-label="Go back" class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md text-maroon-700 active:bg-gray-100 transition-colors">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/-w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Save/Bookmark Button -->
<button aria-label="Save this location" class="w-12 h-12 bg-white rounded-full flex items-center justify-center shadow-md text-maroon-700 active:bg-gray-100 transition-colors">
<svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</header>
<!-- END: Hero Image Section -->
<!-- BEGIN: Site Information Card -->
<!-- Bottom section with details, overlaid onto the image slightly -->
<main class="absolute bottom-0 left-0 right-0 h-[50%] bg-white rounded-t-[32px] pt-8 px-6 pb-6 flex flex-col z-20 card-shadow" data-purpose="details-card">
<!-- Title and Location -->
<div class="mb-4">
<h1 class="font-serif-bold text-4xl text-maroon-800 mb-2 leading-tight">Virupaksha Temple</h1>
<p class="text-gray-600 text-lg">Hampi, Ballari, Karnataka</p>
</div>
<!-- Ratings and Category Tags -->
<div class="flex items-center space-x-4 mb-6">
<!-- Rating -->
<div class="flex items-center space-x-1.5">
<svg class="w-6 h-6 text-[#F2A63D]" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" fill-rule="evenodd"></path>
</svg>
<span class="font-semibold text-maroon-900 text-lg">4.8</span>
<span class="text-gray-500 text-base">(2.1k reviews)</span>
</div>
<!-- Category Tag -->
<span class="bg-[#F9EFEA] text-maroon-800 px-4 py-1.5 rounded-full text-sm font-medium">Temple</span>
</div>
<!-- Description Text -->
<div class="flex-grow overflow-y-auto mb-6 pr-2">
<p class="text-gray-800 text-lg leading-relaxed">
        A sacred temple dedicated to Lord Shiva, built in the 7th century. It is one of the oldest functioning temples in India.
      </p>
</div>
<!-- Action Buttons Row -->
<footer class="flex space-x-4 mt-auto pt-2 safe-area-pb" data-purpose="action-buttons">
<!-- Directions Button (Primary) -->
<button class="flex-1 bg-maroon-700 hover:bg-maroon-800 text-white py-4 px-6 rounded-xl font-medium text-lg flex items-center justify-center space-x-2 transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/-w3.org/2000/svg">
<path d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Directions</span>
</button>
<!-- Save Button (Secondary/Outline) -->
<button class="flex-1 bg-white border border-maroon-800 text-maroon-800 hover:bg-gray-50 py-4 px-6 rounded-xl font-medium text-lg flex items-center justify-center space-x-2 transition-colors active:scale-[0.98]">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
<span>Save</span>
</button>
</footer>
</main>
<!-- END: Site Information Card -->
</body></html>
