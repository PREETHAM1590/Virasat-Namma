<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Choose Language</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=Noto+Serif:wght@500;600&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'app-bg': '#f8f4ed',
            'app-maroon': '#7c1c13',
            'app-text': '#2a2a2a',
            'card-border': '#e2d8ce',
          },
          fontFamily: {
            'serif': ['"Noto Serif"', 'serif'],
            'sans': ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </style>
<style data-purpose="custom-styles">
    body {
      background-color: #f8f4ed; /* fallback */
    }
  </style>
</head>
<body class="bg-app-bg text-app-text font-sans antialiased min-h-screen flex flex-col justify-between p-6">
<!-- BEGIN: Header Section -->
<header class="pt-8 pb-6">
<button aria-label="Go back" class="mb-8 p-2 -ml-2 text-app-maroon focus:outline-none">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<div class="text-center space-y-3">
<h1 class="text-3xl font-serif font-semibold text-app-maroon">Choose Language</h1>
<p class="text-[17px] text-gray-800 leading-snug">Select your preferred language<br/>to continue</p>
</div>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Language Selection List -->
<main class="flex-grow space-y-3">
<!-- English Option (Selected) -->
<label class="flex items-center justify-between bg-white border-2 border-[#d3c4b1] rounded-xl p-4 cursor-pointer shadow-sm relative overflow-hidden transition-all duration-200">
<div class="flex items-center gap-4">
<div class="relative w-7 h-7 bg-app-maroon rounded-full flex items-center justify-center border-2 border-app-maroon">
<svg class="w-5 h-5 text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M19.916 4.626a.75.75 0 01.208 1.04l-9 13.5a.75.75 0 01-1.154.114l-6-6a.75.75 0 011.06-1.06l5.353 5.353 8.493-12.739a.75.75 0 011.04-.208z" fill-rule="evenodd"></path>
</svg>
</div>
<input checked="" class="hidden" name="language" type="radio" value="english"/>
<span class="text-lg font-medium text-app-maroon">English</span>
</div>
<div class="w-7 h-7 bg-app-maroon rounded-full flex items-center justify-center">
<svg class="w-4 h-4 text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M19.916 4.626a.75.75 0 01.208 1.04l-9 13.5a.75.75 0 01-1.154.114l-6-6a.75.75 0 011.06-1.06l5.353 5.353 8.493-12.739a.75.75 0 011.04-.208z" fill-rule="evenodd"></path>
</svg>
</div>
</label>
<!-- Kannada Option -->
<label class="flex items-center bg-white border border-card-border rounded-xl p-4 cursor-pointer shadow-sm hover:border-app-maroon transition-all duration-200">
<div class="flex items-center gap-4">
<div class="w-7 h-7 rounded-full border-[2.5px] border-app-maroon flex-shrink-0"></div>
<input class="hidden" name="language" type="radio" value="kannada"/>
<span class="text-lg text-gray-800">ಕನ್ನಡ <span class="text-[17px] ml-1">(Kannada)</span></span>
</div>
</label>
<!-- Hindi Option -->
<label class="flex items-center bg-white border border-card-border rounded-xl p-4 cursor-pointer shadow-sm hover:border-app-maroon transition-all duration-200">
<div class="flex items-center gap-4">
<div class="w-7 h-7 rounded-full border-[2.5px] border-app-maroon flex-shrink-0"></div>
<input class="hidden" name="language" type="radio" value="hindi"/>
<span class="text-lg text-gray-800">हिंदी <span class="text-[17px] ml-1">(Hindi)</span></span>
</div>
</label>
<!-- Telugu Option -->
<label class="flex items-center bg-white border border-card-border rounded-xl p-4 cursor-pointer shadow-sm hover:border-app-maroon transition-all duration-200">
<div class="flex items-center gap-4">
<div class="w-7 h-7 rounded-full border-[2.5px] border-app-maroon flex-shrink-0"></div>
<input class="hidden" name="language" type="radio" value="telugu"/>
<span class="text-lg text-gray-800">తెలుగు <span class="text-[17px] ml-1">(Telugu)</span></span>
</div>
</label>
<!-- Tamil Option -->
<label class="flex items-center bg-white border border-card-border rounded-xl p-4 cursor-pointer shadow-sm hover:border-app-maroon transition-all duration-200">
<div class="flex items-center gap-4">
<div class="w-7 h-7 rounded-full border-[2.5px] border-app-maroon flex-shrink-0"></div>
<input class="hidden" name="language" type="radio" value="tamil"/>
<span class="text-lg text-gray-800">தமிழ் <span class="text-[17px] ml-1">(Tamil)</span></span>
</div>
</label>
</main>
<!-- END: Language Selection List -->
<!-- BEGIN: Bottom Action -->
<footer class="mt-8 pb-4">
<button class="w-full bg-[#7a130f] hover:bg-app-maroon text-white text-lg font-medium py-4 rounded-xl shadow-md transition-colors duration-200 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-app-maroon">
      Continue
    </button>
</footer>
<!-- END: Bottom Action -->
</body></html>
