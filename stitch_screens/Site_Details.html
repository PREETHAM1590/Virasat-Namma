<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Heritage Site Details</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            serif: ['"Noto Serif"', 'serif'],
            sans: ['Inter', 'sans-serif'],
          },
          colors: {
            brand: {
              primary: '#7A1313', // Dark red
              light: '#F8ECE5',   // Light orange/beige background for tag
              text: '#4A4A4A',
            }
          }
        }
      }
    }
  </script>
<style data-purpose="layout">
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f3f4f6;
      -webkit-font-smoothing: antialiased;
    }
    
    .mobile-container {
      width: 100%;
      max-width: 430px; /* iPhone 14 Pro Max width approx */
      margin: 0 auto;
      background-color: #ffffff;
      min-height: 100vh;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(0,0,0,0.1);
    }

    .bottom-sheet {
      box-shadow: 0 -4px 20px rgba(0,0,0,0.05);
    }
  </style>
</head>
<body>
<!-- BEGIN: Main Mobile Container -->
<div class="mobile-container flex flex-col h-screen relative">
<!-- BEGIN: Hero Image Section -->
<div class="relative h-[55%] w-full">
<!-- Background Image -->
<img alt="Virupaksha Temple" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFJ82dKz9ykUGvmapJUZYxHnMvjJCT-LKHBIVYV6usQ8dKB947jlhX0S0CVoJnAOF6J2cHH3Bxbv6iJ0Yh_ABAoUPaa_b-BnICutVy5ZM41lXL_ouxim6LnReUUXq-mMZR61jhzI2osqCjCiSOJjT0M0JyYMWz2hocsk3oehS9rnNgV4RlPm6WoAo4gBOIdr_0Bk3kC5ZPdN21ca9H6ghGQj5xxYuqZ1E6zS8lvcr3UADRpOXntXN2duQd3lUxWMQQrhue6OuBhfh3"/>
<!-- Top Navigation Icons -->
<div class="absolute top-0 left-0 w-full flex justify-between items-center p-6 pt-12">
<!-- Back Button -->
<button aria-label="Go back" class="bg-white/90 backdrop-blur-sm w-12 h-12 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="#7A1313" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M10.5 19.5L3 12m0 0l7.5-7.5M3 12h18" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Bookmark Button -->
<button aria-label="Bookmark" class="bg-white/90 backdrop-blur-sm w-12 h-12 rounded-full flex items-center justify-center shadow-md active:scale-95 transition-transform">
<svg class="w-6 h-6" fill="none" stroke="#7A1313" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
</div>
<!-- END: Hero Image Section -->
<!-- BEGIN: Details Bottom Sheet -->
<div class="bottom-sheet absolute bottom-0 left-0 w-full bg-white rounded-t-[32px] pt-8 pb-10 px-6 flex flex-col gap-5 min-h-[50%] z-10 h-auto">
<!-- Header Section -->
<div>
<h1 class="font-serif text-4xl font-bold text-brand-primary mb-2">Virupaksha Temple</h1>
<p class="text-gray-500 text-lg">Hampi, Ballari, Karnataka</p>
</div>
<!-- Rating and Tags -->
<div class="flex items-center gap-3">
<div class="flex items-center gap-1">
<!-- Star Icon -->
<svg class="w-6 h-6" fill="#FBBF24" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path clip-rule="evenodd" d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.007 5.404.433c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.433 2.082-5.006z" fill-rule="evenodd"></path>
</svg>
<span class="font-bold text-brand-primary text-xl">4.8</span>
</div>
<span class="text-gray-500 text-base">(2.1k reviews)</span>
<span class="bg-brand-light text-brand-primary px-4 py-1.5 rounded-full text-sm font-medium ml-2">Temple</span>
</div>
<!-- Description -->
<div class="mt-2">
<p class="text-gray-800 text-[17px] leading-relaxed">
          A sacred temple dedicated to Lord Shiva, built in the 7th century. It is one of the oldest functioning temples in India.
        </p>
</div>
<!-- Spacer -->
<div class="flex-grow"></div>
<!-- Action Buttons -->
<div class="flex gap-4 mt-6">
<button class="flex-1 bg-brand-primary text-white py-4 rounded-2xl flex items-center justify-center gap-2 font-medium text-lg active:bg-brand-primary/90 transition-colors shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
          Directions
        </button>
<button class="flex-1 border-2 border-brand-primary text-brand-primary bg-white py-4 rounded-2xl flex items-center justify-center gap-2 font-medium text-lg active:bg-gray-50 transition-colors shadow-sm">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M17.593 3.322c1.1.128 1.907 1.077 1.907 2.185V21L12 17.25 4.5 21V5.507c0-1.108.806-2.057 1.907-2.185a48.507 48.507 0 0111.186 0z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
          Save
        </button>
</div>
</div>
<!-- END: Details Bottom Sheet -->
</div>
<!-- END: Main Mobile Container -->
</body></html>
