<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Travel Passport / Check-ins Onboarding</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#F6EFE2',
              text: '#4A0D15',
              gold: '#C5A069',
              accent: '#8B2B32'
            }
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500&display=swap');
  </style>
<style data-purpose="mandala-bg">
    .bg-mandala {
      background-image: radial-gradient(circle at top left, rgba(197, 160, 105, 0.1) 0%, transparent 40%);
    }
  </style>
</head>
<body class="bg-brand-bg text-brand-text font-sans min-h-screen flex flex-col items-center justify-between relative overflow-hidden bg-mandala w-[375px] mx-auto sm:w-full max-w-md shadow-2xl">
<!-- BEGIN: Top Navigation -->
<header class="w-full flex justify-end p-6 z-10 absolute top-0">
<button class="text-brand-text font-serif text-xl font-semibold hover:opacity-80 transition-opacity">
      Skip
    </button>
</header>
<!-- END: Top Navigation -->
<!-- BEGIN: Main Content Area -->
<main class="flex-1 flex flex-col items-center pt-20 px-6 w-full relative z-10 pb-40">
<!-- Logo/Icon Area -->
<div class="flex items-center justify-center space-x-4 mb-8">
<div class="h-px w-16 bg-brand-gold relative">
<div class="absolute -top-[1px] w-full h-[3px] bg-brand-gold bg-opacity-30"></div>
</div>
<svg class="w-12 h-14 text-brand-gold fill-current" viewbox="0 0 48 56" xmlns="http://www.w3.org/2000/svg">
<path d="M20 10L24 4L28 10V20H20V10Z"></path>
<path d="M12 24L16 20H32L36 24V50H12V24Z"></path>
<path d="M16 26H20V46H16V26Z"></path>
<path d="M28 26H32V46H28V26Z"></path>
<path d="M22 36H26V50H22V36Z"></path>
<rect height="4" width="12" x="18" y="14"></rect>
<rect height="2" width="20" x="14" y="22"></rect>
<!-- Decorative base -->
<path d="M10 50H38V54H10V50Z"></path>
<path d="M8 54H40V56H8V54Z"></path>
</svg>
<div class="h-px w-16 bg-brand-gold relative">
<div class="absolute -top-[1px] w-full h-[3px] bg-brand-gold bg-opacity-30"></div>
</div>
</div>
<!-- Floral ornament below logo -->
<div class="flex items-center justify-center mb-6 text-brand-gold">
<svg class="w-24 h-6" fill="none" viewbox="0 0 100 24" xmlns="http://www.w3.org/2000/svg">
<path d="M0 12C30 12 40 4 50 4C60 4 70 12 100 12" stroke="currentColor" stroke-width="1.5"></path>
<path d="M50 4C52 8 55 12 50 16C45 12 48 8 50 4Z" fill="currentColor"></path>
<path d="M44 10C46 12 48 15 44 18C40 15 42 12 44 10Z" fill="currentColor"></path>
<path d="M56 10C54 12 52 15 56 18C60 15 58 12 56 10Z" fill="currentColor"></path>
</svg>
</div>
<!-- Text Content -->
<div class="text-center mb-10 w-full">
<h1 class="text-3xl font-serif font-bold mb-4 leading-normal">Travel Passport /<br/>Check-ins</h1>
<p class="text-lg font-serif text-brand-text opacity-90 px-2 leading-snug">
        Check-in at sites, collect stamps and track your heritage journey.
      </p>
</div>
<!-- Passport Illustration Area -->
<div class="relative w-full max-w-[320px] aspect-[4/3] flex items-center justify-center mt-4 mb-12 z-20">
<!-- We will simulate the passport with CSS and inline SVG since we don't have the exact image asset, aiming for a close representation -->
<div class="relative w-full h-[280px] flex shadow-[0_20px_40px_-15px_rgba(74,13,21,0.5)]">
<!-- Passport Cover (Left) -->
<div class="w-[55%] h-full bg-[#6B1B22] rounded-l-md border-l border-t border-b border-[#4A0D15] relative overflow-hidden z-20 shadow-[5px_0_15px_-5px_rgba(0,0,0,0.5)] bg-gradient-to-r from-[#5a141b] via-[#6B1B22] to-[#7a2028]">
<!-- Binding gradient -->
<div class="absolute left-0 top-0 w-4 h-full bg-gradient-to-r from-black/40 via-transparent to-transparent"></div>
<div class="absolute inset-0 flex flex-col items-center justify-between py-8 px-4 text-[#D4AF37]">
<div class="text-center">
<div class="font-serif text-lg tracking-widest font-bold">TRAVEL</div>
<div class="font-serif text-lg tracking-widest font-bold">PASSPORT</div>
</div>
<!-- Central Temple Icon -->
<svg class="w-24 h-32 fill-current" viewbox="0 0 64 80" xmlns="http://www.w3.org/2000/svg">
<path d="M24 16L32 8L40 16V30H24V16Z"></path>
<path d="M16 34L20 30H44L48 34V60H16V34Z"></path>
<path d="M22 36H26V56H22V36Z"></path>
<path d="M38 36H42V56H38V36Z"></path>
<path d="M28 46H36V60H28V46Z"></path>
<path d="M12 60H52V64H12V60Z"></path>
<path d="M8 64H56V68H8V64Z"></path>
<!-- Detailed lines -->
<rect height="2" width="8" x="28" y="20"></rect>
<rect height="2" width="12" x="26" y="24"></rect>
<rect height="1" width="24" x="20" y="32"></rect>
<rect height="1" width="28" x="18" y="40"></rect>
<!-- Top adornment -->
<circle cx="28" cy="14" r="1"></circle>
<circle cx="32" cy="12" r="1"></circle>
<circle cx="36" cy="14" r="1"></circle>
</svg>
<div class="text-center pb-2">
<div class="font-serif text-sm tracking-widest">VIRASAT</div>
<div class="font-serif text-sm tracking-widest">NAMMA GUIDE</div>
</div>
</div>
</div>
<!-- Passport Open Page (Right) -->
<div class="w-[50%] h-[98%] mt-[1%] bg-[#FDFBF7] rounded-r-md border-r border-t border-b border-gray-300 relative overflow-hidden z-10 -ml-2 shadow-inner bg-gradient-to-r from-gray-200 via-white to-white">
<!-- Page fold gradient -->
<div class="absolute left-0 top-0 w-8 h-full bg-gradient-to-r from-black/10 via-transparent to-transparent"></div>
<div class="absolute inset-0 flex flex-col justify-start items-center py-4 space-y-4 ml-4">
<!-- Stamp 1 -->
<div class="w-16 h-16 rounded-full border-2 border-[#C5A069] flex flex-col items-center justify-center text-[#C5A069] relative bg-[#FCF8F2]">
<div class="absolute inset-1 rounded-full border border-[#C5A069] border-dashed"></div>
<span class="text-[8px] font-bold uppercase tracking-wider mb-0.5">Hampi</span>
<svg class="w-6 h-6 fill-current mb-0.5" viewbox="0 0 24 24"><path d="M12 4l4 4v8H8V8l4-4zm-2 10h4v2h-4v-2zm0-4h4v2h-4v-2z"></path></svg>
<span class="text-[6px] font-bold uppercase tracking-wider">Karnataka</span>
</div>
<!-- Stamp 2 -->
<div class="w-16 h-16 rounded-full border-2 border-[#C5A069] flex flex-col items-center justify-center text-[#C5A069] relative bg-[#FCF8F2]">
<div class="absolute inset-1 rounded-full border border-[#C5A069] border-dashed"></div>
<span class="text-[8px] font-bold uppercase tracking-wider mb-0.5">Badami</span>
<svg class="w-6 h-6 fill-current mb-0.5" viewbox="0 0 24 24"><path d="M6 14v4h12v-4H6zm2 2h8v-1H8v1zm4-10a4 4 0 00-4 4h8a4 4 0 00-4-4z"></path></svg>
<span class="text-[6px] font-bold uppercase tracking-wider">Karnataka</span>
</div>
<!-- Stamp 3 -->
<div class="w-16 h-16 rounded-full border-2 border-[#C5A069] flex flex-col items-center justify-center text-[#C5A069] relative bg-[#FCF8F2]">
<div class="absolute inset-1 rounded-full border border-[#C5A069] border-dashed"></div>
<span class="text-[7px] font-bold uppercase tracking-wider mb-0.5">Mysore Palace</span>
<svg class="w-6 h-5 fill-current mb-0.5" viewbox="0 0 24 24"><path d="M12 2L4 8v12h16V8L12 2zm0 3.5l5 3.75v8.25h-2v-4h-6v4H7v-8.25L12 5.5z"></path></svg>
<span class="text-[6px] font-bold uppercase tracking-wider">Karnataka</span>
</div>
</div>
<!-- Right side edge indication -->
<div class="absolute right-[-10px] top-4 flex flex-col space-y-4">
<div class="w-16 h-16 rounded-full border border-gray-200"></div>
<div class="w-16 h-16 rounded-full border border-gray-200"></div>
<div class="w-16 h-16 rounded-full border border-gray-200"></div>
</div>
</div>
</div>
</div>
</main>
<!-- END: Main Content Area -->
<!-- BEGIN: Bottom Navigation Wave -->
<footer class="w-full absolute bottom-0 left-0">
<div class="relative w-full h-40 flex items-end">
<!-- White Wave Background -->
<svg class="absolute bottom-0 w-full h-full text-white fill-current drop-shadow-[0_-10px_20px_rgba(0,0,0,0.05)]" fill="none" preserveaspectratio="none" viewbox="0 0 375 140" xmlns="http://www.w3.org/2000/svg">
<path d="M0 40.5C50 40.5 80 40.5 130 40.5C180 40.5 220 40.5 270 20C320 -0.5 375 0 375 0V140H0V40.5Z"></path>
</svg>
<div class="w-full relative z-10 flex justify-between items-center px-8 pb-10 pt-10">
<!-- Progress Dots -->
<div class="flex space-x-3 ml-20">
<div class="w-3.5 h-3.5 rounded-full bg-brand-gold opacity-60"></div>
<div class="w-3.5 h-3.5 rounded-full bg-brand-gold opacity-60"></div>
<!-- Active Dot -->
<div class="w-3.5 h-3.5 rounded-full bg-brand-gold"></div>
<div class="w-3.5 h-3.5 rounded-full bg-[#4A0D15]"></div>
</div>
<!-- Next Button -->
<button class="w-16 h-16 rounded-full bg-brand-gold flex items-center justify-center text-[#4A0D15] shadow-lg hover:bg-opacity-90 transition-all active:scale-95">
<svg class="w-8 h-8 stroke-current" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" viewbox="0 0 24 24">
<line x1="5" x2="19" y1="12" y2="12"></line>
<polyline points="12 5 19 12 12 19"></polyline>
</svg>
</button>
</div>
</div>
</footer>
<!-- END: Bottom Navigation Wave -->
</body></html>
