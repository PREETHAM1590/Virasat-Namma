<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Heritage App Dashboard</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Noto+Serif:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            brand: {
              bg: '#fdf8f4',
              primary: '#6b1b1a', // Deep red for text/icons
              card: '#f4ebd8', // Light tan for cards
              surface: '#ffffff',
              text: '#333333',
              muted: '#666666'
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            serif: ['Noto Serif', 'serif'],
          }
        }
      }
    }
  </script>
<style data-purpose="custom-utilities">
    body {
      background-color: theme('colors.brand.bg');
      color: theme('colors.brand.text');
      -webkit-font-smoothing: antialiased;
    }
    
    .hide-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .hide-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    
    .icon-button {
      @apply flex flex-col items-center justify-center p-4 rounded-xl bg-brand-card shadow-sm transition-transform active:scale-95;
    }
    
    .category-button {
      @apply flex flex-col items-center justify-center p-3 rounded-xl bg-brand-card shadow-sm transition-transform active:scale-95 min-w-[80px];
    }
    
    .bottom-nav-item {
      @apply flex flex-col items-center gap-1 text-brand-muted hover:text-brand-primary transition-colors;
    }
    .bottom-nav-item.active {
      @apply text-brand-primary;
    }
  </style>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/></head>
<body class="min-h-screen flex flex-col font-sans pb-20">
<!-- BEGIN: Header -->
<header class="px-6 pt-12 pb-4 flex justify-between items-center bg-brand-bg sticky top-0 z-10">
<button aria-label="Menu" class="text-2xl text-brand-text hover:text-brand-primary focus:outline-none">
<i class="fa-solid fa-bars"></i>
</button>
<button aria-label="Notifications" class="relative text-2xl text-brand-primary focus:outline-none">
<i class="fa-regular fa-bell"></i>
<span class="absolute top-0 right-0 w-3 h-3 bg-red-600 border-2 border-brand-bg rounded-full"></span>
</button>
</header>
<!-- END: Header -->
<!-- BEGIN: Main Content -->
<main class="flex-1 px-6 space-y-6">
<!-- Greeting Section -->
<section>
<h1 class="font-serif text-4xl font-bold text-brand-primary mb-2 flex items-center gap-2">
        Namaskara! <span class="text-3xl">👋</span>
</h1>
<p class="text-lg text-brand-text font-medium">Where will heritage take you today?</p>
</section>
<!-- Search Bar -->
<section>
<div class="relative flex items-center">
<i class="fa-solid fa-magnifying-glass absolute left-4 text-brand-muted text-lg"></i>
<input class="w-full pl-12 pr-12 py-3.5 rounded-full border border-gray-200 bg-white shadow-sm focus:ring-2 focus:ring-brand-primary focus:border-transparent outline-none font-medium placeholder-gray-400 text-sm" placeholder="Search heritage sites, forts, temples..." type="text"/>
<button class="absolute right-4 text-brand-primary focus:outline-none">
<i class="fa-solid fa-expand text-lg"></i>
</button>
</div>
</section>
<!-- Quick Actions -->
<section class="grid grid-cols-4 gap-3">
<button class="icon-button group">
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-1 text-brand-primary">
<i class="fa-solid fa-location-dot text-2xl"></i>
</div>
<span class="text-xs font-semibold text-brand-text">Nearby</span>
</button>
<button class="icon-button group">
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-1 text-brand-primary">
<i class="fa-solid fa-map text-2xl"></i>
</div>
<span class="text-xs font-semibold text-brand-text">Map</span>
</button>
<button class="icon-button group">
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-1 text-brand-primary">
<i class="fa-solid fa-passport text-2xl"></i>
</div>
<span class="text-xs font-semibold text-brand-text">Passport</span>
</button>
<button class="icon-button group">
<div class="w-10 h-10 rounded-full flex items-center justify-center mb-1 text-brand-primary">
<i class="fa-solid fa-book-open text-2xl"></i>
</div>
<span class="text-xs font-semibold text-brand-text">Guides</span>
</button>
</section>
<!-- Continue Journey Banner -->
<section>
<div class="relative rounded-2xl overflow-hidden shadow-md h-48 bg-gray-800">
<!-- Background Image -->
<img alt="Hampi Heritage Site" class="absolute inset-0 w-full h-full object-cover opacity-80 mix-blend-overlay" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAZY1xqeTacDxoQ5sKmFmeuu7K6p_h9LGcZhywnooEKkClVFEy8PA6Lnag6omdUqrCo5UsJxLkAdYCdlNWLug7KeLMs5mhWoHjiKMx4VAJvP_PgkAs8fRsKtnUl_fuRBghxzaflAzZW-wBD6PO8I0nvF581HD4o9cJFg7ZWZj9ux_aB_zN4k3BQbRxR9VUrvDlCGKJNs1Nk2Fgt6I3OKairEaCpROax-P-XIwMPe-RwwDL1nsP459kZxseYZfIpf-CVZ3Z8kO3eeiSi"/>
<!-- Gradient Overlay -->
<div class="absolute inset-0 bg-gradient-to-r from-black/80 via-black/40 to-transparent"></div>
<!-- Content -->
<div class="absolute inset-0 p-5 flex flex-col justify-between">
<div>
<p class="text-white/80 text-sm font-medium mb-1">Continue Your Journey</p>
<h2 class="font-serif text-3xl text-white font-bold mb-1">Hampi</h2>
<p class="text-white/90 text-sm">Vijayanagara Empire</p>
</div>
<div class="flex items-end justify-between w-full">
<div class="w-2/3 space-y-2">
<p class="text-white text-sm font-medium">3 / 8 Sites Explored</p>
<!-- Progress Bar -->
<div class="w-full bg-white/30 rounded-full h-1.5">
<div class="bg-white h-1.5 rounded-full" style="width: 37.5%"></div>
</div>
</div>
<button class="w-10 h-10 bg-white rounded-full flex items-center justify-center text-brand-text shadow-sm hover:bg-gray-100 transition-colors focus:outline-none">
<i class="fa-solid fa-arrow-right"></i>
</button>
</div>
</div>
</div>
</section>
<!-- Popular Categories -->
<section>
<h3 class="font-serif text-xl font-bold text-brand-primary mb-4">Popular Categories</h3>
<div class="flex gap-3 overflow-x-auto hide-scrollbar pb-2 -mx-6 px-6">
<button class="category-button shrink-0">
<i class="fa-solid fa-vihara text-3xl text-brand-primary mb-2"></i>
<span class="text-xs font-semibold text-brand-text">Temples</span>
</button>
<button class="category-button shrink-0">
<i class="fa-brands fa-fort-awesome text-3xl text-brand-primary mb-2"></i>
<span class="text-xs font-semibold text-brand-text">Forts</span>
</button>
<button class="category-button shrink-0">
<i class="fa-solid fa-chess-rook text-3xl text-brand-primary mb-2"></i>
<span class="text-xs font-semibold text-brand-text">Palaces</span>
</button>
<button class="category-button shrink-0">
<i class="fa-solid fa-person-hiking text-3xl text-brand-primary mb-2"></i>
<span class="text-xs font-semibold text-brand-text flex-col flex items-center"><span>Heritage</span><span>Walks</span></span>
</button>
</div>
</section>
<!-- Recommended For You -->
<section class="pb-6">
<h3 class="font-serif text-xl font-bold text-brand-primary mb-4">Recommended For You</h3>
<div class="flex gap-4 overflow-x-auto hide-scrollbar pb-4 -mx-6 px-6">
<!-- Card 1 -->
<article class="w-64 shrink-0 bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative h-40">
<img alt="Pattadakal" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDGe2a39Aj9EG64C9ExsgVw9ylSiDWHLyfcyHQ2Evd3rxZHNlg9NjizVe9v4tPkbFlF52FDgeIejHenX3BYQJZA1KNg1q_Pfp2HTMOWFMofgv95XVfyNVPy405rni76L7VwmyY7lZfegvhiZYVys7OOu5sLiEIPer6n5ykUtSVaYPKq41KS7Ivolmn-Vk2TQoeIod4FtVtBTfzeEuj5k2G76EcLicvASnYUY7dRHk3pf7blTa_G1KXLKMlse4ZCzXiYG1I1PIobKcmI"/>
<button class="absolute top-3 right-3 w-8 h-8 bg-white rounded-full flex items-center justify-center text-brand-text shadow focus:outline-none hover:text-brand-primary">
<i class="fa-regular fa-bookmark"></i>
</button>
</div>
<div class="p-4 flex flex-col flex-1">
<h4 class="font-serif font-bold text-brand-text mb-1 text-lg leading-tight">Pattadakal</h4>
<p class="text-xs text-brand-muted mb-3 flex-1">UNESCO World Heritage Site</p>
<div class="flex justify-between items-center text-xs text-brand-muted font-medium">
<span class="flex items-center gap-1"><i class="fa-solid fa-location-dot text-gray-400"></i> 77 km away</span>
<span class="flex items-center gap-1 text-brand-text"><i class="fa-solid fa-star text-yellow-400"></i> 4.6</span>
</div>
</div>
</article>
<!-- Card 2 -->
<article class="w-64 shrink-0 bg-white rounded-2xl shadow-sm overflow-hidden flex flex-col">
<div class="relative h-40">
<img alt="Badami Cave Temples" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCWg_g-iXcxg_PKyIgNQeYPOnG6L2IMM6icTIHaYYpg8YV_OkLDvYV0qeBBxXr0PBhUN7s1HdzSdXBuyKEaIkBVA6IWDIgVjUScGur6-45mkl8ZXUf1Pw4AXxr6TUvfT12F2aw-R1IHR2nyfO6HvvzvVLBw8Q1NydGgCZIizhvA6leI_pfrRuSppP3Pncgsbf9KPiciOE8aCCWTB5McRi3vn1A76ovO2YtTjCILuVt5KPckrRhwvM6Kd6X1Dio7cZpOMqFLHAHhkfne"/>
<button class="absolute top-3 right-3 w-8 h-8 bg-white rounded-full flex items-center justify-center text-brand-text shadow focus:outline-none hover:text-brand-primary">
<i class="fa-regular fa-bookmark"></i>
</button>
</div>
<div class="p-4 flex flex-col flex-1">
<h4 class="font-serif font-bold text-brand-text mb-1 text-lg leading-tight">Badami Cave Temples</h4>
<p class="text-xs text-brand-muted mb-3 flex-1">Ancient Rock-cut Temples</p>
<div class="flex justify-between items-center text-xs text-brand-muted font-medium">
<span class="flex items-center gap-1"><i class="fa-solid fa-location-dot text-gray-400"></i> 143 km away</span>
<span class="flex items-center gap-1 text-brand-text"><i class="fa-solid fa-star text-yellow-400"></i> 4.5</span>
</div>
</div>
</article>
<!-- Placeholder for scroll indication -->
<article class="w-12 shrink-0 bg-white/50 rounded-2xl shadow-sm flex items-center justify-center">
<i class="fa-solid fa-chevron-right text-gray-400"></i>
</article>
</div>
</section>
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation -->
<nav class="fixed bottom-0 left-0 right-0 bg-surface border-t border-outline-variant px-4 py-2 pb-safe z-50 shadow-lg">
<div class="flex justify-between items-center max-w-md mx-auto">
<button aria-label="Home" class="flex flex-col items-center gap-1 flex-1 text-primary">
<div class="relative flex flex-col items-center">
<div class="absolute -top-2 w-8 h-1 bg-primary rounded-full"></div>
<span class="material-symbols-outlined text-2xl fill-1">home</span>
<span class="text-[12px] font-bold font-serif uppercase tracking-tight">Home</span>
</div>
</button>
<button aria-label="Discover" class="flex flex-col items-center gap-1 flex-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">search</span>
<span class="text-[12px] font-medium font-serif uppercase tracking-tight">Discover</span>
</button>
<button aria-label="Passport" class="flex flex-col items-center gap-1 flex-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">language</span>
<span class="text-[12px] font-medium font-serif uppercase tracking-tight">Passport</span>
</button>
<button aria-label="Saved" class="flex flex-col items-center gap-1 flex-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">favorite</span>
<span class="text-[12px] font-medium font-serif uppercase tracking-tight">Saved</span>
</button>
<button aria-label="Profile" class="flex flex-col items-center gap-1 flex-1 text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined text-2xl">person</span>
<span class="text-[12px] font-medium font-serif uppercase tracking-tight">Profile</span>
</button>
</div>
</nav>
<!-- END: Bottom Navigation -->
</body></html>
