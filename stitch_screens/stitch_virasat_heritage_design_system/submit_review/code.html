<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Review Submission</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=Plus+Jakarta+Sans:wght@500;600;700;800&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "surface-container-high": "#e7e9e4",
                    "primary-fixed": "#d3ef59",
                    "inverse-surface": "#2e312e",
                    "inverse-on-surface": "#f0f1ec",
                    "on-tertiary-fixed-variant": "#3e4a40",
                    "surface-tint": "#556500",
                    "secondary-fixed-dim": "#b2ceb3",
                    "on-secondary": "#ffffff",
                    "error-container": "#ffdad6",
                    "on-tertiary-fixed": "#131e16",
                    "on-tertiary-container": "#4a554b",
                    "on-error-container": "#93000a",
                    "on-secondary-container": "#526a54",
                    "outline-variant": "#c6c8b0",
                    "on-tertiary": "#ffffff",
                    "background": "#f9faf5",
                    "surface-dim": "#d9dad6",
                    "surface-bright": "#f9faf5",
                    "on-primary-fixed-variant": "#3f4c00",
                    "secondary": "#4c644f",
                    "secondary-container": "#ceeace",
                    "surface-container-lowest": "#ffffff",
                    "surface-container-low": "#f3f4ef",
                    "tertiary-container": "#bdcabd",
                    "surface-variant": "#e2e3de",
                    "outline": "#767964",
                    "primary-fixed-dim": "#b7d23f",
                    "on-surface-variant": "#454836",
                    "on-primary": "#ffffff",
                    "secondary-fixed": "#ceeace",
                    "on-surface": "#1a1c19",
                    "on-secondary-fixed": "#09200f",
                    "surface": "#f9faf5",
                    "primary": "#556500",
                    "surface-container-highest": "#e2e3de",
                    "tertiary-fixed-dim": "#bdcabd",
                    "inverse-primary": "#b7d23f",
                    "primary-container": "#b7d23f",
                    "on-background": "#1a1c19",
                    "tertiary": "#556157",
                    "on-error": "#ffffff",
                    "on-primary-fixed": "#181e00",
                    "on-primary-container": "#4a5800",
                    "surface-container": "#edeee9",
                    "tertiary-fixed": "#d9e6d8",
                    "on-secondary-fixed-variant": "#354c38",
                    "error": "#ba1a1a"
            },
            "borderRadius": {
                    "DEFAULT": "1rem",
                    "lg": "2rem",
                    "xl": "3rem",
                    "full": "9999px"
            },
            "spacing": {
                    "unit": "8px",
                    "overlap-margin": "-32px",
                    "container-padding": "24px",
                    "section-margin": "48px",
                    "element-gap": "16px"
            },
            "fontFamily": {
                    "headline-lg": ["Plus Jakarta Sans"],
                    "label-md": ["Be Vietnam Pro"],
                    "body-lg": ["Be Vietnam Pro"],
                    "headline-md": ["Plus Jakarta Sans"],
                    "body-md": ["Be Vietnam Pro"],
                    "display-lg": ["Plus Jakarta Sans"]
            },
            "fontSize": {
                    "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                    "label-md": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                    "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                    "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                    "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                    "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]

          }
        }
      }

<style>
        .neumorphic-card {
            box-shadow: 12px 12px 32px rgba(85, 101, 0, 0.05), -8px -8px 24px rgba(255, 255, 255, 0.8);
        }
        .inset-recess {
            box-shadow: inset 4px 4px 12px rgba(85, 101, 0, 0.06), inset -4px -4px 12px rgba(255, 255, 255, 0.9);
        }
        .organic-border {
            border-radius: 48px 24px 40px 16px;
        }
        /* Suppressing Bottom Nav completely as this is a task-focused flow */
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen relative overflow-x-hidden selection:bg-primary-container selection:text-on-primary-container">
<!-- Ambient Background Blobs for Organic Feel -->
<div class="fixed top-[-10%] right-[-10%] w-[60vw] h-[60vw] max-w-[500px] max-h-[500px] bg-secondary-container/40 rounded-full blur-[80px] -z-10 pointer-events-none"></div>
<div class="fixed bottom-[-5%] left-[-10%] w-[70vw] h-[70vw] max-w-[600px] max-h-[600px] bg-primary-container/20 rounded-full blur-[100px] -z-10 pointer-events-none"></div>
<!-- TopAppBar (Transactional Flow Variation) -->
<header class="w-full px-container-padding pt-6 pb-4 flex justify-between items-center sticky top-0 bg-background/80 backdrop-blur-md z-40">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest shadow-sm text-on-surface hover:bg-surface-container-low transition-colors active:scale-95">
<span class="material-symbols-outlined text-[28px]" data-icon="close">close</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight text-center flex-1">Share Your Journey</h1>
<div class="w-12 h-12"></div> <!-- Spacer for center alignment -->
</header>
<!-- Main Content Canvas -->
<main class="max-w-2xl mx-auto px-container-padding pt-4 pb-40">
<!-- Large Neumorphic Card -->
<article class="bg-surface-container-lowest rounded-lg p-6 md:p-10 neumorphic-card flex flex-col gap-8">
<!-- Star Rating Section -->
<section class="flex flex-col items-center gap-4 pt-4">
<p class="font-label-md text-label-md text-on-surface-variant uppercase tracking-widest">Rate your experience</p>
<div class="flex items-center justify-center gap-2 md:gap-4">
<button class="transition-transform hover:scale-110 active:scale-90 focus:outline-none">
<span class="material-symbols-outlined text-[40px] md:text-[48px] text-primary-fixed-dim drop-shadow-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="transition-transform hover:scale-110 active:scale-90 focus:outline-none">
<span class="material-symbols-outlined text-[40px] md:text-[48px] text-primary-fixed-dim drop-shadow-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="transition-transform hover:scale-110 active:scale-90 focus:outline-none">
<span class="material-symbols-outlined text-[40px] md:text-[48px] text-primary-fixed-dim drop-shadow-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="transition-transform hover:scale-110 active:scale-90 focus:outline-none">
<span class="material-symbols-outlined text-[40px] md:text-[48px] text-primary-fixed-dim drop-shadow-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
<button class="transition-transform hover:scale-110 active:scale-90 focus:outline-none">
<span class="material-symbols-outlined text-[40px] md:text-[48px] text-surface-container-highest drop-shadow-sm" data-icon="star" style="font-variation-settings: 'FILL' 1;">star</span>
</button>
</div>
</section>
<!-- Add Photos Section (Organic Border) -->
<section class="w-full">
<button class="w-full h-48 border-2 border-dashed border-outline-variant bg-surface-bright organic-border flex flex-col items-center justify-center gap-4 cursor-pointer transition-all duration-300 hover:bg-surface-container-low hover:border-primary-fixed-dim active:scale-[0.98] group">
<div class="w-16 h-16 rounded-[24px] bg-surface-container group-hover:bg-primary-container transition-colors flex items-center justify-center shadow-sm">
<span class="material-symbols-outlined text-[32px] text-primary group-hover:text-on-primary-container transition-colors" data-icon="add">add</span>
</div>
<span class="font-label-md text-label-md text-on-surface-variant group-hover:text-on-surface transition-colors">Add Photos</span>
</button>
</section>
<!-- Text Area (Recessed) -->
<section class="w-full relative">
<textarea class="w-full h-40 bg-background inset-recess rounded-lg p-6 font-body-lg text-body-lg text-on-surface placeholder:text-on-surface-variant/60 border-none focus:ring-2 focus:ring-primary-fixed-dim focus:outline-none resize-none transition-shadow" placeholder="Write your experience..."></textarea>
</section>
</article>
</main>
<!-- Floating Action Area -->
<div class="fixed bottom-0 left-0 w-full px-container-padding pb-8 pt-12 bg-gradient-to-t from-background via-background/90 to-transparent pointer-events-none z-50 flex justify-center">
<button class="pointer-events-auto w-full max-w-sm h-16 bg-primary-fixed-dim text-on-primary-fixed-variant font-label-md text-label-md text-[16px] tracking-wide rounded-full shadow-[inset_0_4px_12px_rgba(255,255,255,0.4),0_8px_24px_rgba(183,210,63,0.3)] hover:opacity-95 hover:shadow-[inset_0_4px_12px_rgba(255,255,255,0.4),0_12px_32px_rgba(183,210,63,0.4)] active:scale-[0.97] transition-all duration-300 flex items-center justify-center gap-2">
            Post Review
        </button>
</div>
</body></html>
