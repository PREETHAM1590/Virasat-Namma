<style>
        .neumorphic-inset {
            box-shadow: inset 4px 4px 8px rgba(0, 0, 0, 0.05), 
                        inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }
        .neumorphic-glow {
            box-shadow: inset 0px 4px 12px rgba(255, 255, 255, 0.4),
                        0px 8px 24px rgba(183, 210, 63, 0.3);
        }
        .soft-shadow {
            box-shadow: -8px -8px 16px rgba(255,255,255,0.8), 
                        8px 8px 16px rgba(0,0,0,0.04);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen flex flex-col font-body-lg text-body-lg text-on-surface antialiased overflow-x-hidden">
<!-- Top Navigation (Transactional screen - Suppress primary navigation elements) -->
<header class="w-full px-container-padding pt-6 pb-4 flex justify-between items-center relative z-20">
<a aria-label="Back" class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest soft-shadow text-primary hover:opacity-80 transition-opacity" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</a>
</header>
<!-- Main Content Area -->
<main class="flex-grow flex flex-col items-center px-container-padding pt-8 pb-12 w-full max-w-md mx-auto relative z-10">
<!-- Welcome Header -->
<div class="w-full text-left mb-12">
<h1 class="font-display-lg text-display-lg text-primary tracking-tight mb-2">Hi, Welcome 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Sign in to continue your journey.</p>
</div>
<!-- Organic Decorative Blob (Background) -->
<div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 bg-secondary-container rounded-[100px] opacity-40 blur-3xl -z-10 mix-blend-multiply"></div>
<div class="absolute bottom-1/4 left-0 -ml-16 w-48 h-48 bg-primary-container rounded-[80px] opacity-30 blur-2xl -z-10 mix-blend-multiply"></div>
<!-- Login Form -->
<form class="w-full flex flex-col gap-element-gap relative z-10">
<!-- Email Input -->
<div class="relative w-full">
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:outline-none neumorphic-inset transition-all" id="email" placeholder="Email Address" required="" type="email"/>
<div class="absolute inset-y-0 right-6 flex items-center pointer-events-none text-outline-variant">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
<!-- Password Input -->
<div class="relative w-full mt-2">
<input class="w-full h-16 px-6 bg-surface-container-low border-none rounded-full font-body-md text-body-md text-on-surface placeholder:text-outline focus:ring-2 focus:ring-primary-container focus:outline-none neumorphic-inset transition-all" id="password" placeholder="Password" required="" type="password"/>
<button class="absolute inset-y-0 right-6 flex items-center text-outline-variant hover:text-primary transition-colors focus:outline-none" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Forgot Password Link -->
<div class="w-full flex justify-end mt-1 mb-4">
<a class="font-label-md text-label-md text-primary hover:opacity-80 transition-opacity underline-offset-4 decoration-primary/30 hover:underline" href="#">Forgot?</a>
</div>
<!-- Sign In Button -->
<button class="w-full h-16 mt-2 bg-primary-container text-on-primary-container rounded-full font-headline-md text-headline-md flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-300 neumorphic-glow" type="submit">
                Sign In
                <span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="w-full flex items-center gap-4 my-8">
<div class="flex-grow h-px bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-outline">or continue with</span>
<div class="flex-grow h-px bg-outline-variant/30"></div>
</div>
<!-- Google Sign In Button -->
<button class="w-full h-16 bg-surface-container-lowest rounded-full font-body-lg text-body-lg text-on-surface flex items-center justify-center gap-3 soft-shadow hover:bg-surface-container-low active:scale-95 transition-all duration-300" type="button">
<svg class="w-6 h-6" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
            Google
        </button>
<!-- Sign Up Prompt -->
<p class="mt-12 font-body-md text-body-md text-on-surface-variant">
            Don't have an account? 
            <a class="font-headline-md text-headline-md text-primary ml-1 hover:underline underline-offset-4 decoration-primary/50 transition-all" href="#">Sign Up</a>
</p>
</main>
<!-- Bottom Navigation Suppressed - Transactional Page Intent -->
</body></html>
