<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Select Language - Virasat</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700&amp;family=Be+Vietnam+Pro:wght@400;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "inverse-on-surface": "#f0f1ec",
                        "outline-variant": "#c6c8b0",
                        "tertiary-container": "#bdcabd",
                        "surface-variant": "#e2e3de",
                        "on-tertiary-fixed-variant": "#3e4a40",
                        "outline": "#767964",
                        "surface-container-lowest": "#ffffff",
                        "error-container": "#ffdad6",
                        "on-surface": "#1a1c19",
                        "on-secondary": "#ffffff",
                        "primary-fixed-dim": "#b7d23f",
                        "inverse-surface": "#2e312e",
                        "on-secondary-container": "#526a54",
                        "surface-container": "#edeee9",
                        "on-background": "#1a1c19",
                        "surface-container-high": "#e7e9e4",
                        "surface-container-low": "#f3f4ef",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#3f4c00",
                        "secondary-fixed": "#ceeace",
                        "on-tertiary": "#ffffff",
                        "surface": "#f9faf5",
                        "on-tertiary-container": "#4a554b",
                        "inverse-primary": "#b7d23f",
                        "on-surface-variant": "#454836",
                        "on-primary-container": "#4a5800",
                        "primary-container": "#b7d23f",
                        "on-secondary-fixed-variant": "#354c38",
                        "surface-tint": "#556500",
                        "tertiary": "#556157",
                        "on-error-container": "#93000a",
                        "tertiary-fixed-dim": "#bdcabd",
                        "secondary-container": "#ceeace",
                        "surface-bright": "#f9faf5",
                        "primary-fixed": "#d3ef59",
                        "secondary": "#4c644f",
                        "surface-container-highest": "#e2e3de",
                        "surface-dim": "#d9dad6",
                        "on-primary-fixed": "#181e00",
                        "on-secondary-fixed": "#09200f",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#b2ceb3",
                        "tertiary-fixed": "#d9e6d8",
                        "on-error": "#ffffff",
                        "on-tertiary-fixed": "#131e16",
                        "primary": "#556500",
                        "background": "#f9faf5"
                    },
                    "borderRadius": {
                        "DEFAULT": "1rem",
                        "lg": "2rem",
                        "xl": "3rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "overlap-margin": "-32px",
                        "section-margin": "48px",
                        "unit": "8px",
                        "element-gap": "16px",
                        "container-padding": "24px"
                    },
                    "fontFamily": {
                        "body-lg": ["Be Vietnam Pro"],
                        "headline-lg": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "body-md": ["Be Vietnam Pro"],
                        "display-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "body-lg": ["18px", { "lineHeight": "28px", "fontWeight": "400" }],
                        "headline-lg": ["32px", { "lineHeight": "40px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "headline-md": ["24px", { "lineHeight": "32px", "fontWeight": "600" }],
                        "body-md": ["16px", { "lineHeight": "24px", "fontWeight": "400" }],
                        "display-lg": ["48px", { "lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label-md": ["14px", { "lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600" }]
                    }
                }
            }
        }
    </script>
<style>
        body {
            background-color: #E2EFE1; /* Pale mint fallback if theme colors don't match exactly */
        }
        .soft-shadow {
            box-shadow: -4px -4px 10px rgba(255,255,255,0.7), 4px 4px 10px rgba(0,0,0,0.05);
        }
        .inset-shadow {
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.05), inset -2px -2px 5px rgba(255,255,255,0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface-container-low min-h-screen font-body-md text-on-surface flex flex-col items-center">
<!-- Top Navigation (Transactional intent, suppressed bottom nav) -->
<header class="w-full px-container-padding pt-4 bg-transparent flex justify-between items-center max-w-md mx-auto">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest soft-shadow text-on-surface-variant hover:text-primary transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<div class="font-headline-lg text-headline-lg text-primary tracking-tight">Virasat</div>
<div class="w-12 h-12"></div> <!-- Spacer -->
</header>
<!-- Main Content Area -->
<main class="flex-grow w-full max-w-md mx-auto px-container-padding pt-section-margin pb-32 flex flex-col gap-element-gap relative z-10">
<div class="mb-4">
<h1 class="font-display-lg text-display-lg text-primary leading-tight">Select<br/>Language</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant mt-2">Choose your preferred language for the Virasat experience.</p>
</div>
<!-- Language Options Container -->
<div class="flex flex-col gap-4 relative">
<!-- Option 1: Selected -->
<label class="relative block cursor-pointer group">
<input checked="" class="peer sr-only" name="language" type="radio" value="english"/>
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow border-2 border-primary-container peer-checked:bg-surface-container-lowest flex items-center justify-between transition-all duration-300">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">English</span>
<span class="font-body-md text-body-md text-on-surface-variant">English</span>
</div>
<!-- Custom Radio selected state -->
<div class="w-8 h-8 rounded-full border-2 border-primary-container bg-primary-container flex items-center justify-center text-on-primary-container">
<span class="material-symbols-outlined text-[20px]" data-icon="check" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
</label>
<!-- Option 2 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="language" type="radio" value="hindi"/>
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow border-2 border-transparent hover:border-outline-variant flex items-center justify-between transition-all duration-300">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">हिंदी</span>
<span class="font-body-md text-body-md text-on-surface-variant">Hindi</span>
</div>
<!-- Custom Radio unselected state -->
<div class="w-8 h-8 rounded-full border-2 border-outline-variant bg-surface-container-lowest flex items-center justify-center inset-shadow">
</div>
</div>
</label>
<!-- Option 3 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="language" type="radio" value="marathi"/>
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow border-2 border-transparent hover:border-outline-variant flex items-center justify-between transition-all duration-300">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">मराठी</span>
<span class="font-body-md text-body-md text-on-surface-variant">Marathi</span>
</div>
<!-- Custom Radio unselected state -->
<div class="w-8 h-8 rounded-full border-2 border-outline-variant bg-surface-container-lowest flex items-center justify-center inset-shadow">
</div>
</div>
</label>
<!-- Option 4 -->
<label class="relative block cursor-pointer group">
<input class="peer sr-only" name="language" type="radio" value="gujarati"/>
<div class="bg-surface-container-lowest rounded-xl p-6 soft-shadow border-2 border-transparent hover:border-outline-variant flex items-center justify-between transition-all duration-300">
<div class="flex flex-col">
<span class="font-headline-md text-headline-md text-on-surface">ગુજરાતી</span>
<span class="font-body-md text-body-md text-on-surface-variant">Gujarati</span>
</div>
<!-- Custom Radio unselected state -->
<div class="w-8 h-8 rounded-full border-2 border-outline-variant bg-surface-container-lowest flex items-center justify-center inset-shadow">
</div>
</div>
</label>
</div>
</main>
<!-- Floating Action Area (Bottom Pinned) -->
<div class="fixed bottom-0 left-0 w-full p-container-padding bg-gradient-to-t from-surface-container-low via-surface-container-low to-transparent pb-8 z-50 flex justify-center pointer-events-none">
<div class="w-full max-w-md pointer-events-auto">
<button class="w-full bg-primary-container text-on-primary-container font-label-md text-label-md py-4 px-8 rounded-full soft-shadow flex items-center justify-center gap-2 hover:opacity-90 active:scale-95 transition-all duration-300 group">
<span>Continue</span>
<span class="material-symbols-outlined transition-transform group-hover:translate-x-1" data-icon="arrow_forward">arrow_forward</span>
</button>
</div>
</div>
</body></html>
