<style>
        .neumorphic-inset {
            box-shadow: inset 4px 4px 8px rgba(189, 202, 189, 0.5), inset -4px -4px 8px rgba(255, 255, 255, 0.8);
        }
        .neumorphic-button {
            box-shadow: 6px 6px 12px rgba(189, 202, 189, 0.4), -6px -6px 12px rgba(255, 255, 255, 0.9), inset 2px 2px 4px rgba(255, 255, 255, 0.3);
        }
      </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface text-on-surface antialiased min-h-screen flex flex-col items-center justify-center p-container-padding relative">
<!-- Top Navigation (Hidden on transactional pages like Sign Up, but keeping header structure for brand anchor) -->
<header class="absolute top-0 left-0 w-full px-container-padding pt-4 flex justify-between items-center bg-transparent z-10">
<button class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-lowest text-on-surface-variant hover:opacity-80 transition-opacity active:scale-95 shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary tracking-tight">Virasat</h1>
<div class="w-12 h-12"></div> <!-- Spacer for balance -->
</header>
<main class="w-full max-w-md mx-auto flex flex-col gap-section-margin z-0 mt-20 pb-24">
<!-- Hero / Greeting -->
<section class="flex flex-col gap-unit text-center">
<h2 class="font-display-lg text-display-lg text-on-surface">Join Us</h2>
<p class="font-body-lg text-body-lg text-on-surface-variant">Become a custodian of heritage.</p>
</section>
<!-- Sign Up Form -->
<form class="flex flex-col gap-element-gap w-full">
<!-- Name Input -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full bg-surface-container-lowest border-none font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:ring-2 focus:ring-primary-container neumorphic-inset transition-all" id="name" placeholder="Full Name" type="text"/>
</div>
<!-- Email Input -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full bg-surface-container-lowest border-none font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:ring-2 focus:ring-primary-container neumorphic-inset transition-all" id="email" placeholder="Email Address" type="email"/>
</div>
<!-- Password Input -->
<div class="relative group">
<input class="w-full h-14 px-6 rounded-full bg-surface-container-lowest border-none font-body-md text-body-md text-on-surface placeholder:text-outline outline-none focus:ring-2 focus:ring-primary-container neumorphic-inset transition-all" id="password" placeholder="Password" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-on-surface-variant" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Secondary Action (Login instead) -->
<div class="flex justify-center mt-4">
<p class="font-body-md text-body-md text-on-surface-variant">
                    Already have an account? 
                    <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="#">Log in</a>
</p>
</div>
</form>
</main>
<!-- Floating Action Button - Create Account -->
<div class="fixed bottom-8 left-0 w-full px-container-padding flex justify-center z-50 pointer-events-none">
<button class="pointer-events-auto w-full max-w-md h-16 rounded-full bg-primary-container text-on-primary-container font-headline-md text-headline-md neumorphic-button hover:opacity-90 active:scale-95 transition-all duration-300 flex items-center justify-center gap-2">
            Create Account
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_forward</span>
</button>
</div>
</body></html>
