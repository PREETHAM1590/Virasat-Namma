<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - Heritage Journey</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Outfit:wght@300;400;500;600&display=swap');
    
    body {
      font-family: 'Outfit', sans-serif;
    }
    
    .font-serif-custom {
      font-family: 'Libre Baskerville', serif;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'heritage-bg': '#fbf6f0',
            'heritage-maroon': '#7c1613',
            'heritage-text': '#332724',
            'heritage-text-light': '#6a5b57',
            'heritage-border': '#e0cebb',
          },
          backgroundImage: {
            'mandala-pattern': "url('data:image/svg+xml,%3Csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cpath d=\"M50 0 C60 20 80 40 100 50 C80 60 60 80 50 100 C40 80 20 60 0 50 C20 40 40 20 50 0 Z\" fill=\"none\" stroke=\"%23eadaCC\" stroke-width=\"0.5\" opacity=\"0.5\"/%3E%3C/svg%3E')",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-heritage-bg min-h-screen flex flex-col relative overflow-hidden text-heritage-text font-sans">
<!-- BEGIN: Background Elements -->
<!-- Top decorative pattern -->
<div class="absolute top-0 left-0 w-full h-64 bg-mandala-pattern opacity-60 pointer-events-none" style="background-size: 200px; background-position: top center; mask-image: linear-gradient(to bottom, black, transparent); -webkit-mask-image: linear-gradient(to bottom, black, transparent);"></div>
<!-- Bottom temple silhouette -->
<div class="absolute bottom-0 left-0 w-full z-0 pointer-events-none">
<svg class="w-full h-auto text-[#d4b9a9] opacity-70" fill="none" preserveaspectratio="none" viewbox="0 0 1000 300" xmlns="http://www.w3.org/2000/svg">
<!-- Simplified Temple Silhouettes -->
<path d="M100 300 V200 L120 180 V150 L130 140 L140 150 V180 L160 200 V300 Z" fill="currentColor"></path>
<path d="M110 200 H150 V220 H110 Z" fill="#c3a28f"></path>
<path d="M125 150 H135 V170 H125 Z" fill="#c3a28f"></path>
<path d="M300 300 V230 L320 210 V180 L330 170 L340 180 V210 L360 230 V300 Z" fill="currentColor"></path>
<path d="M310 230 H350 V250 H310 Z" fill="#c3a28f"></path>
<path d="M450 300 V150 L480 120 V80 L500 60 L520 80 V120 L550 150 V300 Z" fill="currentColor"></path>
<path d="M470 150 H530 V180 H470 Z" fill="#c3a28f"></path>
<path d="M485 80 H515 V110 H485 Z" fill="#c3a28f"></path>
<path d="M650 300 V220 L670 200 V170 L680 160 L690 170 V200 L710 220 V300 Z" fill="currentColor"></path>
<path d="M800 300 V180 L830 150 V110 L850 90 L870 110 V150 L900 180 V300 Z" fill="currentColor"></path>
<path d="M820 180 H880 V210 H820 Z" fill="#c3a28f"></path>
<path d="M835 110 H865 V140 H835 Z" fill="#c3a28f"></path>
<!-- Connectors and base -->
<path d="M0 300 V260 H100 V300 Z" fill="currentColor"></path>
<path d="M160 300 V270 H300 V300 Z" fill="currentColor"></path>
<path d="M360 300 V250 H450 V300 Z" fill="currentColor"></path>
<path d="M550 300 V280 H650 V300 Z" fill="currentColor"></path>
<path d="M710 300 V260 H800 V300 Z" fill="currentColor"></path>
<path d="M900 300 V270 H1000 V300 Z" fill="currentColor"></path>
</svg>
</div>
<!-- END: Background Elements -->
<!-- BEGIN: Main Content Area -->
<main class="flex-grow flex flex-col justify-center px-6 relative z-10 w-full max-w-md mx-auto mb-24 mt-12">
<!-- BEGIN: Header Section -->
<header class="text-center mb-10">
<h1 class="font-serif-custom text-4xl text-heritage-maroon mb-4 tracking-wide">Welcome Back!</h1>
<p class="text-heritage-text text-lg leading-snug font-medium">
        Login to continue your<br/>heritage journey
      </p>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Login Form -->
<form class="space-y-5" onsubmit="event.preventDefault();">
<!-- Input: Email/Phone -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-6 w-6 text-heritage-text-light" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-12 pr-4 py-4 bg-transparent border border-heritage-border rounded-xl text-heritage-text placeholder-heritage-text-light focus:outline-none focus:border-heritage-maroon focus:ring-1 focus:ring-heritage-maroon transition-colors text-[17px]" id="identifier" name="identifier" placeholder="Email or Phone Number" type="text"/>
</div>
<!-- Input: Password -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
<svg class="h-6 w-6 text-heritage-text-light" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
<input class="w-full pl-12 pr-12 py-4 bg-transparent border border-heritage-border rounded-xl text-heritage-text placeholder-heritage-text-light focus:outline-none focus:border-heritage-maroon focus:ring-1 focus:ring-heritage-maroon transition-colors text-[17px]" id="password" name="password" placeholder="Password" type="password"/>
<div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer">
<svg class="h-6 w-6 text-heritage-text-light" fill="none" stroke="currentColor" stroke-width="1.5" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l3.59 3.59m0 0A9.953 9.953 0 0112 5c4.478 0 8.268 2.943 9.543 7a10.025 10.025 0 01-4.132 5.411m0 0L21 21" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</div>
</div>
<!-- Forgot Password Link -->
<div class="flex justify-end pt-1">
<a class="text-[15px] text-heritage-maroon hover:underline font-medium" href="#">Forgot Password?</a>
</div>
<!-- Login Button -->
<div class="pt-2">
<button class="w-full bg-[#831818] hover:bg-[#681313] text-white font-medium py-4 rounded-xl text-lg shadow-sm transition-colors" type="submit">
          Login
        </button>
</div>
</form>
<!-- END: Login Form -->
<!-- BEGIN: Alternative Login -->
<div class="mt-8">
<div class="relative flex items-center justify-center mb-8">
<div class="border-t border-[#dfcec3] w-full"></div>
<div class="absolute bg-heritage-bg px-4 text-heritage-text-light text-[15px]">or</div>
</div>
<button class="w-full flex items-center justify-center gap-3 bg-transparent border border-heritage-border py-4 rounded-xl text-[17px] text-heritage-text font-medium hover:bg-white/50 transition-colors shadow-sm" type="button">
<svg class="w-6 h-6" viewbox="0 0 48 48" xmlns="http://www.w3.org/2000/svg">
<path d="M43.611 20.083H42V20H24v8h11.303c-1.649 4.657-6.08 8-11.303 8-6.627 0-12-5.373-12-12s5.373-12 12-12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 12.955 4 4 12.955 4 24s8.955 20 20 20 20-8.955 20-20c0-1.341-.138-2.65-.389-3.917z" fill="#FFC107"></path>
<path d="M6.306 14.691l6.571 4.819C14.655 15.108 18.961 12 24 12c3.059 0 5.842 1.154 7.961 3.039l5.657-5.657C34.046 6.053 29.268 4 24 4 16.318 4 9.656 8.337 6.306 14.691z" fill="#FF3D00"></path>
<path d="M24 44c5.166 0 9.86-1.977 13.409-5.192l-6.19-5.238C29.211 35.091 26.715 36 24 36c-5.202 0-9.619-3.317-11.283-7.946l-6.522 5.025C9.505 39.556 16.227 44 24 44z" fill="#4CAF50"></path>
<path d="M43.611 20.083H42V20H24v8h11.303c-.792 2.237-2.231 4.166-4.087 5.571c.001-.001.002-.001.003-.002l6.19 5.238C36.971 39.205 44 34 44 24c0-1.341-.138-2.65-.389-3.917z" fill="#1976D2"></path>
</svg>
        Continue with Google
      </button>
</div>
<!-- END: Alternative Login -->
<!-- BEGIN: Footer Links -->
<div class="mt-10 text-center">
<p class="text-heritage-text text-[16px]">
        Don't have an account? 
        <a class="text-heritage-maroon font-medium hover:underline" href="#">Sign Up</a>
</p>
</div>
<!-- END: Footer Links -->
</main>
<!-- END: Main Content Area -->
</body></html>
