<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Virasat Namma Guide - Splash Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-fonts">
    body {
      font-family: 'Noto Serif', serif;
    }
  </style>
<script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'virasat-cream': '#F4F0E6',
            'virasat-maroon': '#7A1A1A',
            'virasat-gold': '#B89B5E',
          },
          backgroundImage: {
            'mandala-pattern': "url('data:image/svg+xml,%3Csvg width=\"100\" height=\"100\" viewBox=\"0 0 100 100\" xmlns=\"http://www.w3.org/2000/svg\"%3E%3Cpath d=\"M50 0C50 27.614 27.614 50 0 50C27.614 50 50 72.386 50 100C50 72.386 72.386 50 100 50C72.386 50 50 27.614 50 0Z\" fill=\"%23E5E0D4\" fill-opacity=\"0.4\" fill-rule=\"evenodd\"/%3E%3C/svg%3E')",
          }
        }
      }
    }
  </script>
</head>
<body class="bg-virasat-cream min-h-screen flex flex-col items-center justify-center relative overflow-hidden">
<!-- BEGIN: Background Textures -->
<div class="absolute inset-0 pointer-events-none opacity-50 bg-mandala-pattern background-repeat" data-purpose="background-pattern"></div>
<div class="absolute top-0 left-0 w-full h-48 bg-gradient-to-b from-white/30 to-transparent pointer-events-none" data-purpose="top-gradient"></div>
<!-- END: Background Textures -->
<!-- BEGIN: Main Content Container -->
<main class="relative z-10 w-full max-w-md mx-auto flex flex-col items-center justify-between h-screen pt-12 pb-0">
<!-- BEGIN: Top Section - Logo Image -->
<section class="flex flex-col items-center flex-grow pt-8" data-purpose="logo-section">
<!-- Decorative Ornaments Top -->
<div class="relative w-64 h-64 mb-6">
<div class="absolute inset-0 rounded-full border-4 border-virasat-gold p-2 shadow-xl shadow-virasat-gold/20">
<img alt="Virasat Stone Chariot" class="w-full h-full object-cover rounded-full mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/ADBb0ujbgyiT9wx7OTjm293JV1-yAbdPVJHSx2dU_lHXrQ1gcVNTOy1zIRg2RHRPmSsRYuzfIeUEvfPrmLiA4iLSOH8TS7gcilq3ZEzUtFMRGyWnTHPkywt8OB-mHG4_vm920WsTfqYTGJDFfe_32LiWXVbdZrE7hUPBpATFiVEE13ZTikrSZhvXDnCrGrN2MDhDBl8-4DiXF2fLzRfpjjSbyVNAmQSIzR25YpjxxeZ8E0Sd5zFyvteSSAXNrHRnXp5Xd8PqGodqs387mJI" style="object-position: center 25%;"/>
</div>
<!-- Center Lotus Badge -->
<div class="absolute -bottom-6 left-1/2 transform -translate-x-1/2 w-16 h-16 bg-virasat-maroon rounded-full border-4 border-virasat-cream flex items-center justify-center shadow-lg">
<svg class="w-8 h-8 text-white" fill="currentColor" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M12 2C12 2 15 7 15 12C15 17 12 22 12 22C12 22 9 17 9 12C9 7 12 2 12 2Z"></path>
<path d="M12 22C12 22 7 19 4 15C1 11 2 6 2 6C2 6 7 7 10 10C13 13 12 22 12 22Z"></path>
<path d="M12 22C12 22 17 19 20 15C23 11 22 6 22 6C22 6 17 7 14 10C11 13 12 22 12 22Z"></path>
</svg>
</div>
</div>
</section>
<!-- END: Top Section - Logo Image -->
<!-- BEGIN: Middle Section - Typography -->
<section class="flex flex-col items-center text-center mt-8 z-20" data-purpose="typography-section">
<h1 class="text-6xl font-bold text-virasat-maroon tracking-widest uppercase mb-2">Virasat</h1>
<h2 class="text-2xl font-semibold text-virasat-maroon tracking-[0.2em] uppercase mb-6">Namma Guide</h2>
<!-- Divider -->
<div class="flex items-center space-x-4 mb-6 w-3/4 mx-auto">
<div class="h-[1px] flex-grow bg-virasat-gold"></div>
<div class="w-2 h-2 rotate-45 border border-virasat-gold"></div>
<div class="h-[1px] flex-grow bg-virasat-gold"></div>
</div>
<p class="text-lg font-medium text-gray-800 tracking-wide mb-12">Explore. Learn. Preserve.</p>
</section>
<!-- END: Middle Section - Typography -->
<!-- BEGIN: Bottom Section - Temples Silhouette -->
<section class="w-full relative mt-auto" data-purpose="bottom-silhouette">
<div class="w-full h-64 opacity-80 mix-blend-multiply overflow-hidden relative">
<img alt="Temple Silhouettes" class="w-full object-cover object-bottom absolute bottom-0 h-[200%]" src="https://lh3.googleusercontent.com/aida/ADBb0ujbgyiT9wx7OTjm293JV1-yAbdPVJHSx2dU_lHXrQ1gcVNTOy1zIRg2RHRPmSsRYuzfIeUEvfPrmLiA4iLSOH8TS7gcilq3ZEzUtFMRGyWnTHPkywt8OB-mHG4_vm920WsTfqYTGJDFfe_32LiWXVbdZrE7hUPBpATFiVEE13ZTikrSZhvXDnCrGrN2MDhDBl8-4DiXF2fLzRfpjjSbyVNAmQSIzR25YpjxxeZ8E0Sd5zFyvteSSAXNrHRnXp5Xd8PqGodqs387mJI" style="object-position: center bottom;"/>
</div>
<!-- Curved Footer Graphic -->
<div class="absolute bottom-0 w-full">
<svg class="w-full h-auto text-virasat-maroon" fill="currentColor" preserveaspectratio="none" viewbox="0 0 1440 320">
<path d="M0,160L80,170.7C160,181,320,203,480,197.3C640,192,800,160,960,154.7C1120,149,1280,171,1360,181.3L1440,192L1440,320L1360,320C1280,320,1120,320,960,320C800,320,640,320,480,320C320,320,160,320,80,320L0,320Z"></path>
</svg>
<!-- Decorative Border overlay -->
<div class="absolute bottom-4 left-0 w-full flex justify-center opacity-30 px-4">
<svg height="20" preserveaspectratio="none" viewbox="0 0 100 20" width="100%">
<pattern height="20" id="triangle" patternunits="userSpaceOnUse" width="10">
<polygon fill="transparent" points="5,0 10,10 0,10" stroke="#B89B5E" stroke-width="1"></polygon>
<circle cx="5" cy="15" fill="#B89B5E" r="1.5"></circle>
</pattern>
<rect fill="url(#triangle)" height="20" width="100%"></rect>
</svg>
</div>
</div>
</section>
<!-- END: Bottom Section - Temples Silhouette -->
</main>
<!-- END: Main Content Container -->
</body></html>
