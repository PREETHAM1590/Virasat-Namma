<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Onboarding - Scan QR</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style data-purpose="custom-fonts">
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&display=swap');
    
    body {
      font-family: 'Noto Serif', serif;
    }
  </style>
<script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "surface-container": "#efefd7",
            "tertiary-container": "#4c392a",
            "primary-fixed": "#ffdad4",
            "secondary-container": "#fed65b",
            "on-tertiary": "#ffffff",
            "on-surface": "#1b1d0e",
            "on-error": "#ffffff",
            "outline-variant": "#e2bfb9",
            "secondary": "#735c00",
            "on-secondary-fixed-variant": "#574500",
            "on-error-container": "#93000a",
            "surface-container-high": "#eaead1",
            "on-background": "#1b1d0e",
            "on-surface-variant": "#5a413d",
            "surface": "#fbfbe2",
            "surface-tint": "#b22b1d",
            "primary-container": "#800000",
            "surface-variant": "#e4e4cc",
            "surface-container-lowest": "#ffffff",
            "surface-dim": "#dbdcc3",
            "inverse-primary": "#ffb4a8",
            "surface-container-highest": "#e4e4cc",
            "on-tertiary-fixed": "#28180b",
            "surface-container-low": "#f5f5dc",
            "on-primary-container": "#ff8371",
            "on-primary": "#ffffff",
            "on-primary-fixed-variant": "#8f0f07",
            "inverse-on-surface": "#f2f2d9",
            "error": "#ba1a1a",
            "secondary-fixed-dim": "#e9c349",
            "primary": "#570000",
            "on-tertiary-fixed-variant": "#574333",
            "on-tertiary-container": "#bea28f",
            "outline": "#8e706c",
            "tertiary": "#342416",
            "primary-fixed-dim": "#ffb4a8",
            "on-secondary-container": "#745c00",
            "surface-bright": "#fbfbe2",
            "tertiary-fixed-dim": "#dec1ac",
            "on-primary-fixed": "#410000",
            "inverse-surface": "#303221",
            "error-container": "#ffdad6",
            "tertiary-fixed": "#fbddc7",
            "on-secondary": "#ffffff",
            "secondary-fixed": "#ffe088",
            "on-secondary-fixed": "#241a00",
            "background": "#fbfbe2"
          },
          fontFamily: {
            "headline-xl": ["Noto Serif"],
            "headline-md": ["Noto Serif"],
            "body-md": ["Noto Serif"],
            "headline-lg": ["Noto Serif"],
            "label-md": ["Noto Serif"],
            "body-lg": ["Noto Serif"]
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background min-h-screen flex flex-col relative overflow-hidden text-on-background">
<!-- BEGIN: Header Section -->
<header class="w-full pt-12 px-6 flex justify-end z-10" data-purpose="onboarding-header">
<button class="text-primary font-semibold text-lg tracking-wide hover:opacity-80 transition-opacity">
      Skip
    </button>
</header>
<!-- END: Header Section -->
<!-- BEGIN: Main Content -->
<main class="flex-grow flex flex-col items-center pt-8 px-6 pb-32 z-10" data-purpose="onboarding-content">
<!-- Text Content -->
<div class="text-center max-w-[320px] mx-auto mb-8">
<h1 class="text-4xl leading-[1.2] font-bold text-primary mb-6">
        Scan QR &amp;<br/>
        Unlock Hidden<br/>
        Facts
      </h1>
<p class="text-[17px] leading-[1.6] text-on-background opacity-90">
        Scan QR codes at heritage sites<br/>
        to discover fascinating stories,<br/>
        history and lesser-known facts.
      </p>
</div>
<!-- Illustration Area -->
<div class="relative w-full max-w-[400px] flex-grow flex items-center justify-center mt-4" data-purpose="central-illustration">
<img alt="Stone pillar with embedded QR code set against ancient temples" class="w-full h-auto object-contain mix-blend-multiply" src="https://lh3.googleusercontent.com/aida/ADBb0uhkgL7wEHlkjk1m3chn-FrN0Eb8tiWwgi_sodH9dssydsZ_xFkRRkr2-eiIhA5M4QRvmDr0kY53y3V9rbOhYLLtMrANPOjztVCRcrrmgpw48QIH305c0Z1DJHXO6S97bky_XzcBS-AXGyrELrIwx5Z1u-XEqaz-VF8HSEIGKavyl3FKxre-erP7NqLCWkRUXe67ssV6nmQI96loCeStZnawEQn5w3ii8t3kjbiHWMmfbP7pEvuvRDhc9onC" style="max-height: 45vh;"/>
</div>
</main>
<!-- END: Main Content -->
<!-- BEGIN: Bottom Navigation -->
<footer class="absolute bottom-0 w-full pb-12 px-8 flex items-center justify-between z-20 bg-gradient-to-t from-background via-background to-transparent pt-8" data-purpose="onboarding-navigation">
<!-- Progress Dots -->
<div class="flex items-center gap-3 pl-2" data-purpose="progress-indicators">
<div class="w-2.5 h-2.5 rounded-full border border-primary"></div>
<div class="w-3 h-3 rounded-full bg-primary"></div>
<div class="w-2.5 h-2.5 rounded-full border border-primary"></div>
<div class="w-2.5 h-2.5 rounded-full border border-primary"></div>
</div>
<!-- Next Button -->
<button aria-label="Next step" class="w-16 h-16 rounded-full bg-primary text-on-primary flex items-center justify-center hover:bg-opacity-90 transition-all shadow-lg focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary">
<svg class="w-7 h-7" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
<path d="M13.5 4.5L21 12m0 0l-7.5 7.5M21 12H3" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</footer>
<!-- END: Bottom Navigation -->
</body></html>
